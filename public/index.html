<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Articulate: AI English Voice Tutor & Phonetic Coach</title>
  <meta name="description" content="Voice-first AI English Tutor with sub-word phoneme scoring, high-cadence drills, and immersive professional roleplays.">
  <meta name="theme-color" content="#090B0E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-monogram">A</div>
        <div class="brand-text">
          <span class="brand-title">Articulate</span>
          <span class="brand-subtitle">Voice Tutor & Phonetic Coach</span>
        </div>
      </div>
      <div class="header-actions">
        <div class="status-badge" id="system-status-badge">
          <span class="status-dot"></span>
          <span id="system-status-text">Gemini Active</span>
        </div>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs" aria-label="Mode Navigation">
      <button class="tab-btn active" data-mode="roleplay" id="tab-roleplay">
        <span data-icon="messageSquare" data-icon-class="w-4 h-4"></span>
        <span>Roleplay</span>
      </button>
      <button class="tab-btn" data-mode="gym" id="tab-gym">
        <span data-icon="dumbbell" data-icon-class="w-4 h-4"></span>
        <span>Phoneme Gym</span>
      </button>
      <button class="tab-btn" data-mode="drill" id="tab-drill">
        <span data-icon="zap" data-icon-class="w-4 h-4"></span>
        <span>Cadence Drills</span>
      </button>
      <button class="tab-btn" data-mode="vault" id="tab-vault">
        <span data-icon="brain" data-icon-class="w-4 h-4"></span>
        <span>Memory Vault</span>
        <span class="tab-badge" id="vault-badge" style="display: none;">0</span>
      </button>
    </nav>

    <!-- Context / Scenario Header -->
    <div class="context-bar" id="context-bar">
      <div class="context-title">
        <span data-icon="sparkles" data-icon-class="w-3.5 h-3.5" style="color: var(--accent-amber);"></span>
        <span id="context-title-text">Loading Scenario...</span>
      </div>
      <button class="context-selector-btn" id="context-selector-btn">
        <span>Change</span>
        <span data-icon="chevronRight" data-icon-class="w-3 h-3"></span>
      </button>
    </div>

    <!-- Main Chat & Interaction Timeline -->
    <main class="chat-workspace" id="chat-workspace" role="log" aria-live="polite">
      <!-- Dynamic turns rendered here -->
    </main>

    <!-- Scaffolding Chips Bar -->
    <div class="scaffolding-bar" id="scaffolding-bar">
      <span class="scaffolding-label">Sentence Starters (Tap to hear)</span>
      <div class="scaffolding-chips" id="scaffolding-chips">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Push-to-Talk & Audio Control Dock -->
    <div class="audio-dock" id="audio-dock">
      <div class="waveform-container" id="waveform-container" aria-hidden="true">
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
      </div>

      <button class="btn-ptt" id="btn-ptt" title="Tap to talk or hold Spacebar" aria-label="Microphone Push to Talk">
        <span data-icon="mic" data-icon-class="w-7 h-7"></span>
      </button>

      <span class="ptt-caption" id="ptt-caption">Tap or Hold Space to Speak</span>
    </div>
  </div>

  <!-- Modal: Sub-word IPA Phoneme Breakdown -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-word-title">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h2 class="modal-word-title" id="modal-word-title">think</h2>
          <span class="modal-accuracy-score" id="modal-accuracy-score">Accuracy: 88%</span>
        </div>
        <button class="btn-modal-close" id="btn-modal-close" aria-label="Close modal">
          <span data-icon="x" data-icon-class="w-5 h-5"></span>
        </button>
      </div>

      <!-- Phoneme accuracy grid -->
      <div class="phoneme-grid" id="phoneme-grid">
        <!-- Cells generated dynamically -->
      </div>

      <!-- Articulatory placement guide -->
      <div class="articulatory-box" id="articulatory-box">
        <div class="articulatory-title" id="articulatory-title">Articulatory Mechanics</div>
        <p class="articulatory-tips" id="articulatory-tips"></p>
        <p class="articulatory-errors" id="articulatory-errors"></p>
      </div>

      <div class="modal-actions">
        <button class="btn-modal-action btn-modal-primary" id="btn-modal-gotit">Understood</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration skipped:', err));
      });
    }
  </script>
</body>
</html>
